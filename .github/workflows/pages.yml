# examples/ の playground を GitHub Pages に公開する。
# examples は ../lib/esm を import するが lib/ は git 管理外なので、ビルドしてから同じ相対配置で載せる。

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続 push で古いデプロイが新しいものを上書きしないよう、実行中のものは待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # ubuntu の runner には rustup が入っているので、wasm 用の target だけ足す
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm build:wasm
      - name: Assemble site
        run: |
          mkdir -p _site/lib
          cp -R examples _site/examples
          cp -R lib/esm _site/lib/esm
          cp -R lib/wasm _site/lib/wasm
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./examples/"><a href="./examples/">playground</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
      - id: deployment
        uses: actions/deploy-pages@v4
